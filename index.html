
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЗДО «Садочок Ластівка»</title>
<meta name="google-site-verification" content="googlef65215cea252f3e4.html" />
<style>
body{margin:0;font-family:Arial;background:#f4fdf7}
header{background:#2ecc71;color:#fff;padding:15px;text-align:center;position:relative}
header button{position:absolute;right:15px;top:15px;padding:8px 12px;background:#27ae60;color:#fff;border:none;border-radius:5px;cursor:pointer}
nav{display:flex;flex-wrap:wrap;justify-content:center;background:#27ae60}
nav button{border:none;background:none;color:#fff;padding:10px 14px;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.2)}
.section{display:none;padding:20px}
.section.active{display:block}
.card{background:#fff;padding:15px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,.1);margin-bottom:15px}
button.openBtn{background:#27ae60;color:#fff;padding:8px 12px;border:none;border-radius:5px;cursor:pointer;margin:5px 0}
footer{text-align:center;padding:15px;background:#eee}
.hidden{display:none}
/* login */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center}
.modal-content{background:#fff;padding:20px;border-radius:10px;width:300px}
.modal-content input{width:100%;padding:8px;margin:10px 0}
</style>
</head>
<body>

<header>
<h1>ЗДО «Садочок Ластівка»</h1>
<p>Офіційний сайт</p>
<button onclick="openLogin()">Увійти</button>
</header>

<nav>
<button onclick="openTab('home')">Головна</button>
<button onclick="openTab('news')">Новини</button>
<button onclick="openTab('album')">Фотоальбом</button>
<button onclick="openTab('groups')">Групи</button>
<button onclick="openTab('schedule')">Розклад</button>
<button onclick="openTab('collective')">Педколектив</button>
<button onclick="openTab('inclusive')">Інклюзія</button>
<button onclick="openTab('statut')">Статут</button>
<button onclick="openTab('orders')">Накази</button>
<button class="admin hidden" onclick="openTab('attestation')">Атестація</button>
<button class="admin hidden" onclick="openTab('admin')">Адмінка</button>
</nav>

<!-- Вкладки -->
<div id="home" class="section active">
<div class="card"><h2>Ласкаво просимо!</h2><p>Офіційний сайт ЗДО «Садочок Ластівка»</p></div>
</div>

<div id="news" class="section">
<div class="card">
<h2>Новини</h2>
<button class="openBtn" onclick="openFolder('news')">Відкрити новини</button>
</div>
</div>

<div id="album" class="section">
<div class="card">
<h2>Фотоальбом</h2>
<button class="openBtn" onclick="openFolder('album')">Відкрити фотоальбом</button>
</div>
</div>

<div id="groups" class="section">
<div class="card">
<h2>Групи</h2>
<select id="groupSelect">
<option value="BDZ">Бджілки</option>
<option value="VES">Веселка</option>
<option value="ZIRO">Зірочки</option>
<option value="KRAP">Краплинки</option>
<option value="PIZ">Пізнайко</option>
<option value="SONE">Сонечко</option>
<option value="CHOM">Чомусики</option>
<option value="SONY">Соняшник</option>
</select>
<button onclick="openGroupFolder()">Відкрити групу</button>
</div>
</div>

<div id="schedule" class="section">
<div class="card">
<h2>Розклад</h2>
<button class="openBtn" onclick="openFolder('schedule')">Відкрити розклад</button>
</div>
</div>

<div id="collective" class="section">
<div class="card">
<h2>Педколектив</h2>
<button class="openBtn" onclick="openFolder('collective')">Відкрити педколектив</button>
</div>
</div>

<div id="inclusive" class="section">
<div class="card">
<h2>Інклюзивна освіта</h2>
<button class="openBtn" onclick="openFolder('inclusive')">Відкрити інклюзію</button>
</div>
</div>

<div id="statut" class="section">
<div class="card">
<h2>Статут</h2>
<button class="openBtn" onclick="openFolder('statut')">Відкрити статут</button>
</div>
</div>

<div id="orders" class="section">
<div class="card">
<h2>Накази</h2>
<button class="openBtn" onclick="openFolder('orders')">Відкрити накази</button>
</div>
</div>

<div id="attestation" class="section">
<div class="card">
<h2>Атестація</h2>
<button class="openBtn" onclick="openFolder('attestation')">Відкрити атестацію</button>
</div>
</div>

<div id="admin" class="section">
<div class="card">
<h2>Адмінка</h2>
<p>Тут буде управління сайтом</p>
</div>
</div>

<footer>© ЗДО «Садочок Ластівка»</footer>

<!-- LOGIN -->
<div id="login" class="modal">
<div class="modal-content">
<h3>Вхід</h3>
<input id="loginInput" placeholder="Email або код">
<button onclick="login()">Увійти</button>
</div>
</div>

<script>
let isAdmin = false;

const folders = {
  news: "1zooffQ541chkyuKTUul2nkPjJDwirvxQ",
  album: "1IknDuijQtf-RrgZ8PtK89K1W2_tWz6xU",
  ZIRO: "1NniCYxUD-PQG7C_QRuWc7xw02BMgdagk",
  KRAP: "1ILclmWrIcnjUO5A0inVl1lFKYr-M0KZ2",
  SONE: "1IaHJfVHh_g9W55Yc1ZIeGVPBQqsZxdAG",
  SONY: "1cjb4QtNFRAcVbNB62YaHsp0n8L4r8wzg",
  PIZ: "1_88DhBgMjTTY9Bnxh-HFlhyIHROHkx5B",
  CHOM: "16wVHEkqukh9DEyDiaW_QqjnBCH_aWxDn",
  VES: "1x4hdq03XGAvSasfasuUZDnglTzIGeAtl",
  BDZ: "1JGMSOMT_J2t3BaH-gb9zfTsBa0Mwcit_",
  schedule: "1WiA4RmGSrRH29CbrXg14df5JtuYd6TeJ",
  collective: "1Fwu64LsLkIeybCPFTni-_5DgFPvtBMp7",
  inclusive: "10Q-sd76LpOaqeMxjuyNNYUhFwHMz3lRK",
  statut: "1fJZhnr-yTZ5Uecl4jdnkuSEDhleSx0dz",
  orders: "1ANR6bzU3viTLAgj2NSY-n6JfDlzs_9mS",
  attestation: "1lQD4YsBpRtvemJlvn5xkUHF96TktZL-K"
};

function openFolder(id){
  const url = https://drive.google.com/drive/folders/${folders[id]};
  window.open(url, '_blank');
}

function openGroupFolder(){
  const select = document.getElementById("groupSelect");
  const groupId = select.value;
  openFolder(groupId);
}

function openTab(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function openLogin(){
  document.getElementById('login').style.display='flex';
}

function login(){
  let v=document.getElementById('loginInput').value;
  if(v==="1980"){
    alert("Вихователь");
    document.getElementById('login').style.display='none';
    isAdmin = false;
  } else if(v==="lisovectana370@gmail.com"){
    alert("Адмін");
    document.querySelectorAll('.admin').forEach(e=>e.classList.remove('hidden'));
    document.getElementById('login').style.display='none';
    isAdmin = true;
  } else alert("Невірні дані");
}
</script>

</body>
</html>
